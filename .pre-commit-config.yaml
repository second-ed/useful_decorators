repos:
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.5.26
    hooks:
      - id: uv-lock
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.4
    hooks:
      # linter.
    - id: ruff
      entry: ruff check
      args: [ --fix]
      # formatter.
    - id: ruff-format
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: python
        pass_filenames: false
        args: [--explicit-package-bases, src]
      - id: pytest
        name: pytest
        entry: uv run pytest -v --cov=src --cov-report term-missing
        language: python
        pass_filenames: false
        always_run: true
